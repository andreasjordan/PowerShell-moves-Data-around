# Requires: Docker Compose 2.30.0 and later
name: powershell-moves-data-around
services:

  sqlserver:
    # To find latest SQL Server images, see https://mcr.microsoft.com/en-us/artifact/mar/mssql/server
    image: mcr.microsoft.com/mssql/server:2025-CU5-ubuntu-24.04
    ports:
      - 1433:1433
    environment:
      MSSQL_SA_PASSWORD: '${MSSQL_SA_PASSWORD}'
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_AGENT_ENABLED: True
    mem_limit: 2gb
    volumes:
      - sqlserver:/var/opt/mssql
      - ./sqlserver-init.sh:/init-scripts/init.sh:ro
      - ./sqlserver-timesheets.sql:/init-scripts/timesheets.sql:ro
      - ./sqlserver-stackexchange.sql:/init-scripts/stackexchange.sql:ro
      - ./sqlserver-geodata.sql:/init-scripts/geodata.sql:ro
      - ./sqlserver-photoservice.sql:/init-scripts/photoservice.sql:ro
      - ./sqlserver-projectstatus.sql:/init-scripts/projectstatus.sql:ro
    command: [ "bash", "/init-scripts/init.sh" ]

  oracle:
    # To find latest Oracle images, see https://container-registry.oracle.com/ords/ocr/ba/database/express
    # From the website:
    # The Oracle XE Database server Docker image contains Oracle Database Express Edition Release 21c (21.3.0.0) running on Oracle Linux 7.
    # This image contains a default database in a multitenant configuration with one pluggable database.
    image: container-registry.oracle.com/database/express:21.3.0-xe
    ports:
      - 1521:1521
    environment:
      ORACLE_PWD: '${ORACLE_PWD}'
      ORACLE_CHARACTERSET: AL32UTF8
    mem_limit: 3gb
    volumes:
      - oracle:/opt/oracle
      - ./oracle-stackexchange.sql:/opt/oracle/scripts/startup/stackexchange.sql:ro
      - ./oracle-geodata.sql:/opt/oracle/scripts/startup/geodata.sql:ro

  postgres:
    # To find latest PostGIS images, see https://hub.docker.com/r/postgis/postgis
    image: postgis/postgis:18-3.6
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
    mem_limit: 1gb
    volumes:
      - postgres:/var/lib/postgresql
      - ./postgres-stackexchange.sql:/docker-entrypoint-initdb.d/stackexchange.sql:ro
      - ./postgres-geodata.sql:/docker-entrypoint-initdb.d/geodata.sql:ro
      - ./postgres-photoservice.sql:/docker-entrypoint-initdb.d/photoservice.sql:ro

  pgadmin:
    # To find latest pgAdmin images, see https://hub.docker.com/r/dpage/pgadmin4
    image: dpage/pgadmin4:9.15.0
    ports:
      - 5050:80
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGPASS_FILE: /pgadmin4/pgpass
      PGADMIN_DISABLE_POSTFIX: 'True'
    volumes:
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin-pgpass:/pgadmin4/pgpass:ro

  mongo:
    # To find latest MongoDB images, see https://hub.docker.com/_/mongo
    image: mongo:7.0.34
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

  redpanda:
    # To find latest Redpanda images, see https://docs.redpanda.com/current/get-started/quick-start/
    # Redpanda speaks the Kafka protocol, so every client and every word in the demo is Kafka.
    # It is one container with no JVM, which matters next to the five that are already here.
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.1
    ports:
      - 19092:19092
      - 19644:9644
    volumes:
      - redpanda:/var/lib/redpanda/data
    # Two listeners, and this is the part that is easy to get wrong. The photoservice container
    # reaches the broker over the compose network as redpanda:9092; the demo reaches it from
    # Windows as 127.0.0.1:19092. A broker advertises the address a client should come back on,
    # so it has to advertise both - one per listener.
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info

  redpanda-console:
    # Somewhere to look at the topic while talking about it, the way pgAdmin is there for
    # PostgreSQL. To find latest images, see https://hub.docker.com/r/redpandadata/console
    image: docker.redpanda.com/redpandadata/console:v3.9.0
    ports:
      - 8080:8080
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - redpanda

  photoservice:
    # To find latest PowerShell images, see https://mcr.microsoft.com/en-us/artifact/mar/powershell/tags
    image: mcr.microsoft.com/powershell:preview-7.6-ubuntu-24.04
    volumes:
      # The shop stores local time - see Get-LocalTimestamp in the application - and without this
      # line "local" is UTC, because the image has no time zone data at all. The demo would then
      # show orders two hours in the past for no visible reason. Mounting the host's file is enough
      # for .NET to pick the zone up; TZ on its own does nothing here, there is no tzdata to read.
      - /etc/localtime:/etc/localtime:ro
      - ./photoservice-app.ps1:/PhotoService/app.ps1:ro
      - ./photoservice-CustomerSource.json:/PhotoService/CustomerSource.json:ro
      - /usr/local/share/powershell/Modules:/usr/local/share/powershell/Modules:ro
      - ../lib:/PhotoService/lib:ro
    working_dir: /PhotoService
    command: pwsh -File /PhotoService/app.ps1

volumes:
  sqlserver: {}
  oracle: {}
  postgres: {}
  mongo: {}
  redpanda: {}
